# The actual Raft consensus layer of this whole project. Three static
# members, each on its own node (see podAntiAffinity), forming one Raft
# group. Patroni does not implement consensus itself — it stores the
# cluster leader key/lease and cluster state in this etcd cluster and
# reacts to what Raft decides.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: raft-lab
spec:
  serviceName: etcd-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: etcd

      containers:
        - name: etcd
          # The official etcd image has no shell (no /bin/sh), so every
          # per-pod value below is resolved via Kubernetes' own $(VAR)
          # substitution in args (from the downward-API POD_NAME env var)
          # rather than a wrapper shell script.
          image: quay.io/coreos/etcd:v3.5.16
          command: ["etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd
            - --listen-peer-urls=http://0.0.0.0:2380
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).etcd-headless.raft-lab.svc.cluster.local:2379
            - --initial-advertise-peer-urls=http://$(POD_NAME).etcd-headless.raft-lab.svc.cluster.local:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd-headless.raft-lab.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.raft-lab.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.raft-lab.svc.cluster.local:2380
            - --initial-cluster-token=raft-lab-etcd
            - --initial-cluster-state=new
            - --auto-compaction-mode=revision
            - --auto-compaction-retention=1000

          ports:
            - name: peer
              containerPort: 2380
            - name: client
              containerPort: 2379

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCDCTL_API
              value: "3"

          readinessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
                - --endpoints=http://localhost:2379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
                - --endpoints=http://localhost:2379
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/etcd

  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        # Set this explicitly when your cluster has no default StorageClass.
        # kind ships one ("standard") out of the box.
        # storageClassName: standard
